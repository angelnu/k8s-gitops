---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-settings
  namespace: flux-system
data:
  # Cluster dependent
  CLUSTER_NAME: prod

  CLUSTER_EXTERNAL_SUBNET_PREFIX: "192.168.5"
  CLUSTER_LB_RANGE: "192.168.5.128-192.168.5.192"

  # ClusterIP of the envoy-gateway proxy Service. The EnvoyProxy patch
  # (apps/envoy-gateway/app/envoyproxy.yaml) pins the Service to this value, so
  # it stays stable across proxy Service recreations (deletion, EG reinstall,
  # gateway rename). Apps attached to the UDN localnet cannot reach the gateway
  # LB VIP when the envoy proxy pod is on the same node (OVN UDN hairpin) - they
  # resolve the affected hostnames to this ClusterIP via pod hostAliases instead.
  # To move it deliberately: pick a free IP in the service CIDR (172.30.0.0/16)
  # and change BOTH this value and the EnvoyProxy patch together (same value,
  # one Flux apply - the Service update keeps the old IP until both land).
  ENVOY_GATEWAY_CLUSTER_IP: "172.30.187.158"

  FLUX_NOTIFICATIONS_CHANNEL: k8s
  BOTKUBE_NOTIFICATIONS_CHANNEL: k8s

  NFS_KUBERNETES: /volume1/kubernetes
  NFS_DOWNLOADS: /volume1/downloads
  NFS_SOFTWARE: /volume1/software
  NFS_VIDEO: /volume1/video
  NFS_MUSIC: /volume1/music
