---
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: "${MY_APP}-db"
  annotations:
    fluxcd.controlplane.io/reconcile: "enabled"
    fluxcd.controlplane.io/reconcileEvery: "30m"
    fluxcd.controlplane.io/reconcileTimeout: "5m"
spec:
  inputs:
    - is_initdb: ${POSTGRES_IS_INITDB=false}
      existingSecretName: ${POSTGRES_EXISTING_SECRETNAME=false}
      walSize: "${POSTGRES_WALSTORAGE_SIZE}"
  resources: []

  resourcesTemplate: |
      ---
      apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      metadata:
        name: "${MY_APP}-db"
        namespace: << inputs.provider.namespace >>
        annotations:
          cnpg.io/skipEmptyWalArchiveCheck: enabled # Allow for backup source and target to be the same
      spec:
        instances: 3 # 1 Primary + 2 Replicas for High Availability

        # PodDisruptionBudgets: never evict more than one instance at a time;
        # the operator switches the primary away before its node is drained
        enablePDB: true

        switchoverDelay: 60 # 1 minute is plenty for "hiccup" protection

        # 'unsupervised' means the operator handles primary updates automatically
        primaryUpdateStrategy: unsupervised
        # Switch over to a synced replica instead of restarting the primary in place
        primaryUpdateMethod: switchover

        postgresql:
          # Quorum-based synchronous replication (replaces minSyncReplicas/maxSyncReplicas)
          synchronous:
            method: any
            number: 1                  # one replica confirming each commit is enough
            dataDurability: preferred  # never block writes when no healthy replica is available
          parameters:
            # Cap WAL retained by an orphaned replication slot:
            # half of the WAL volume (min 1GB), leaving room for max_wal_size
            max_slot_wal_keep_size: "<< max 1 (div (trimSuffix "Gi" inputs.walSize | atoi) 2) >>GB"

        affinity:
          # "required" ensures pods NEVER share a node
          podAntiAffinityType: required
          # Use "kubernetes.io/hostname" to target individual worker nodes
          topologyKey: kubernetes.io/hostname

        imageName: ghcr.io/cloudnative-pg/postgresql:17.1

        # 1. Continuous Backup to Synology (MinIO)
        plugins:
          - name: barman-cloud.cloudnative-pg.io
            isWALArchiver: true
            parameters:
              barmanObjectName: cluster-nas-backup

        # 2. Resource Management
        # NOTE: requests != limits => Burstable QoS, not Guaranteed.
        # The 2Gi limit gives headroom for the page cache (shared_buffers
        # below is sized to match) while the low request keeps schedulability.
        resources:
          requests:
            memory: "384Mi"  # observed 2026-09-24: 70-480Mi per instance
            cpu: "20m"
          limits:
            memory: "2Gi"
            cpu: "1"

        # 2b. PostgreSQL tuning
        # - pg_stat_statements for query performance visibility. Declaring the
        #   extension makes CNPG add shared_preload_libraries automatically.
        # - More aggressive autovacuum for hot, frequently-updated app tables
        #   (e.g. Nextcloud oc_filecache / oc_jobs) that never reach the
        #   default 0.2 / 0.1 scale-factor thresholds.
        # - Cache sizing matched to the 2Gi memory limit: the operator default
        #   leaves shared_buffers too small (128MB) and effective_cache_size
        #   misleadingly large (4GB) relative to the container limit.
        postgresql:
          extensions:
            - pg_stat_statements
          parameters:
            autovacuum_vacuum_scale_factor: "0.05"
            autovacuum_analyze_scale_factor: "0.02"
            autovacuum_vacuum_cost_limit: "2000"
            shared_buffers: "512MB"
            effective_cache_size: "1536MB"

        # 3. Storage Configuration
        storage:
          storageClass: &storageClass openebs-hostpath
          size: ${POSTGRES_STORAGE_SIZE}
        walStorage:
          # Separate WAL storage avoids IO contention with data files
          storageClass: *storageClass
          size: ${POSTGRES_WALSTORAGE_SIZE}

        externalClusters:
          - name: source
            plugin:
              name: barman-cloud.cloudnative-pg.io
              parameters:
                barmanObjectName: cluster-nas-backup
                serverName: "${MY_APP}-db"

        backup:
          target: prefer-standby # instead of primary

        # 4. Database Initialization
        bootstrap:
          <<- if inputs.is_initdb >>
          initdb:
            database: app
            <<- if inputs.existingSecretName >>
            secret:
              name: << inputs.existingSecretName >>
            <<- end >>
          <<- else >>
          recovery:
            source: source
            database: app
            <<- if inputs.existingSecretName >>
            secret:
              name: << inputs.existingSecretName >>
            <<- end >>
          <<- end >>
