---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ${MY_NAMESPACE}
spec:
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      interval: 60m
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  interval: 30m
  timeout: 20m
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  # See https://github.com/bjw-s/helm-charts/blob/main/charts/library/common/values.yaml
  values:
    controllers:
      main:
        containers:
          main:
            securityContext:
              # NET_RAW: ping integration (icmplib) + DHCP discovery watcher
              # granted by the dedicated 'home-assistant' SCC (clusters/prod/config/scc.yaml)
              capabilities:
                add: ["NET_RAW", "NET_ADMIN"]
            # observed 2026-09-24: p95 1.25Gi, max 1.3Gi. Generous limit; review with >=1 week of Prometheus data
            resources:
              requests:
                cpu: 100m
                memory: 1536Mi
              limits:
                memory: 2560Mi
            image:
              repository: ghcr.io/home-assistant/home-assistant
              tag: 2026.11.0@sha256:c6c1ca9931036bf3a2c4cc088d8db25dfea3b33935a5ecc83c40349462e2f69e
            env:
              TZ: "Europe/Berlin"
            probes:
              #Circumvention - avoid restart
              liveness:
                enabled: false
              readiness:
                enabled: false
              startup:
                enabled: false
          editor:
            image:
              repository: ghcr.io/coder/code-server
              tag: 4.145.2@sha256:09565f9e07f5624554e295e8bab0e2fec4a7c533eb3cff459ed6596a4d3d7c1c
            args:
              - --auth
              - none
              - --port
              - "12321"
              - /config
            securityContext:
              runAsUser: 0
        pod:
          hostAliases:
            # The pod's UDN localnet route (192.168.0.0/19) shadows eth0 for all LAN
            # IPs, including the envoy-gateway LB VIP. OVN UDN-localnet pods cannot
            # reach a LB VIP whose backend pod is on the same node (hairpin drops the
            # return path) - this hung hass-oidc-auth's server-side OIDC discovery
            # fetch, so envoy answered "upstream request timeout" (504) on
            # /auth/oidc/redirect (observed 2026-10-18 after the Gateway API migration
            # gave envoy its own VIP on the HA node).
            # Resolve the ingress hostnames via the pinned gateway ClusterIP instead:
            # TLS terminates at envoy with the proper cert, so the OIDC
            # discovery/token/JWKS calls work. The ClusterIP is pinned by the
            # EnvoyProxy patch (apps/envoy-gateway/app/envoyproxy.yaml), so it is
            # stable across proxy Service recreations - no re-check needed.
            # NOTE: /etc/hosts does not follow CNAMEs - hass-oidc-auth resolves
            # authentik.pub.* directly, so THAT entry is the one that matters;
            # casa96-ingress.* (the CNAME target of the *.pub DNS) is listed for
            # anything resolving it directly.
            - ip: "${ENVOY_GATEWAY_CLUSTER_IP}"
              hostnames:
                - "casa96-ingress.${CLUSTER_DOMAIN}"
                - "authentik.pub.${CLUSTER_DOMAIN}"

          annotations:
            k8s.v1.cni.cncf.io/networks: |
              [
                {
                  "name": "localnet",
                  "interface": "localnet",
                  "ips": [
                    "${CLUSTER_EXTERNAL_SUBNET_PREFIX}.${CLUSTER_LOCALNET_HA}/${CLUSTER_LOCALNET_PREFIX_LENGTH}"
                    ]
                }
              ]
    persistence:
      config:
        enabled: true
        existingClaim: home-assistant-pvc
      ssh-key:
        enabled: true
        type: secret
        name: git-ssh-keys
        defaultMode: 256
        items:
          - key: id_rsa
            path: id_rsa
          - key: known_hosts
            path: known_hosts
        advancedMounts:
          main:
            editor:
              - path: /root/.ssh/id_rsa
                subPath: id_rsa
              - path: /root/.ssh/known_hosts
                subPath: known_hosts
    
    serviceAccount:
      default:
        enabled: true
    rbac:
      bindings:
        default:
          type: RoleBinding
          roleRef:
            name: system:openshift:scc:anyuid
            kind: ClusterRole
          subjects:
            - identifier: default

    service:
      main:
        controller: main
        type: LoadBalancer
        loadBalancerIP: "${CLUSTER_EXTERNAL_SUBNET_PREFIX}.${CLUSTER_LB_HA}"
        #Allows exposing the port for openccu to connect to
        publishNotReadyAddresses: true
        ports:
          http:
            port: 8123
          homematicproxy:
            enabled: true
            port: 2001
            targetPort: 2001
          #Callback ports for the homematicip_local integration (CCU pushes
          #XML-RPC events to HA on these): BidCos-RF 2010, HmIP-RF 2011
          homematicproxy-bidcos-rf:
            enabled: true
            port: 2010
            targetPort: 2010
          homematicproxy-hmip-rf:
            enabled: true
            port: 2011
            targetPort: 2011
      editor:
        controller: main
        ports:
          http:
            port: 12321

    ingress:
      main:
        enabled: false
        annotations:
          nginx.org/websocket-services: home-assistant
          nginx.ingress.kubernetes.io/enable-global-auth: "false"
          nginx.ingress.kubernetes.io/ssl-redirect: "false" #Required by Reolink integration to push images via http
        hosts:
          - host: ha.${CLUSTER_SHORT_DOMAIN}
            paths: &paths
              - path: /
                pathType: Prefix
                service:
                  identifier: main
                  port: http
          - host: ha.pub.${CLUSTER_DOMAIN}
            paths: *paths
          - host: ha.home.${CLUSTER_DOMAIN}
            paths: *paths
      editor:
        enabled: false
        hosts:
          - host: ha-editor.pub.${CLUSTER_DOMAIN}
            paths: &paths_editor
              - path: /
                pathType: Prefix
                service:
                  identifier: editor
                  port: http

    route:
      main:
        annotations:
          routeboard.io/group: "automation"
        enabled: true
        hostnames:
          - ha.${CLUSTER_SHORT_DOMAIN}
          - ha.pub.${CLUSTER_DOMAIN}
          - ha.home.${CLUSTER_DOMAIN}
        parentRefs:
          - name: main
            namespace: envoy-gateway
        # explicit rule: 2 services (main + editor) defeat automatic detection
        rules:
          - backendRefs:
              - identifier: main
                port: http
      editor:
        annotations:
          routeboard.io/group: "automation"
        enabled: true
        hostnames:
          - ha-editor.pub.${CLUSTER_DOMAIN}
        parentRefs:
          - name: main
            namespace: envoy-gateway
        # explicit rule: 2 services (main + editor) defeat automatic detection
        rules:
          - backendRefs:
              - identifier: editor
                port: http
