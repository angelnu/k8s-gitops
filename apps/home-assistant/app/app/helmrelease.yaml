---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ${MY_NAMESPACE}
spec:
  chart:
    spec:
      chart: app-template
      version: 5.2.1
      interval: 60m
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  interval: 30m
  timeout: 20m
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  # See https://github.com/bjw-s/helm-charts/blob/main/charts/library/common/values.yaml
  values:
    controllers:
      main:
        containers:
          main:
            securityContext:
              # NET_RAW: ping integration (icmplib) + DHCP discovery watcher
              # granted by the dedicated 'home-assistant' SCC (clusters/prod/config/scc.yaml)
              capabilities:
                add: ["NET_RAW", "NET_ADMIN"]
            # observed 2026-09-24: p95 1.25Gi, max 1.3Gi. Generous limit; review with >=1 week of Prometheus data
            resources:
              requests:
                cpu: 100m
                memory: 1536Mi
              limits:
                memory: 2560Mi
            image:
              repository: ghcr.io/home-assistant/home-assistant
              tag: 2026.9.4@sha256:3e6710a7ab2a61311d9d899b719f6c3657791c63e8f4942cec4ebc42401d6b76
            env:
              TZ: "Europe/Berlin"
            probes:
              #Circumvention - avoid restart
              liveness:
                enabled: false
              readiness:
                enabled: false
              startup:
                enabled: false
          editor:
            image:
              repository: ghcr.io/coder/code-server
              tag: 4.140.0@sha256:1c9ad972a78450f430155144110da4c02d3627c72a598e9197e2781fb9f92e28
            args:
              - --auth
              - none
              - --port
              - "12321"
              - /config
            securityContext:
              runAsUser: 0
        pod:
          # hostAliases:
          #   # We cannot access the ingress LB address directly - go through external IP
          #   - ip: "${FIX_EXTERNAL_IP}"
          #     hostnames:
          #       - "nextcloud.${CLUSTER_DOMAIN}"
          #       - "jellyfin.pub.${CLUSTER_DOMAIN}"

          annotations:
            k8s.v1.cni.cncf.io/networks: |
              [
                {
                  "name": "localnet",
                  "interface": "localnet",
                  "ips": [
                    "${CLUSTER_EXTERNAL_SUBNET_PREFIX}.${CLUSTER_LOCALNET_HA}/${CLUSTER_LOCALNET_PREFIX_LENGTH}"
                    ]
                }
              ]
    persistence:
      config:
        enabled: true
        existingClaim: home-assistant-pvc
      ssh-key:
        enabled: true
        type: secret
        name: git-ssh-keys
        defaultMode: 256
        items:
          - key: id_rsa
            path: id_rsa
        advancedMounts:
          main:
            editor:
              - path: /root/.ssh/id_rsa
                subPath: id_rsa
    
    serviceAccount:
      default:
        enabled: true
    rbac:
      bindings:
        default:
          type: RoleBinding
          roleRef:
            name: system:openshift:scc:anyuid
            kind: ClusterRole
          subjects:
            - identifier: default

    service:
      main:
        controller: main
        type: LoadBalancer
        loadBalancerIP: "${CLUSTER_EXTERNAL_SUBNET_PREFIX}.${CLUSTER_LB_HA}"
        #Allows exposing the port for openccu to connect to
        publishNotReadyAddresses: true
        ports:
          http:
            port: 8123
          homematicproxy:
            enabled: true
            port: 2001
            targetPort: 2001
      editor:
        controller: main
        ports:
          http:
            port: 12321

    ingress:
      main:
        enabled: false
        annotations:
          nginx.org/websocket-services: home-assistant
          nginx.ingress.kubernetes.io/enable-global-auth: "false"
          nginx.ingress.kubernetes.io/ssl-redirect: "false" #Required by Reolink integration to push images via http
        hosts:
          - host: ha.${CLUSTER_SHORT_DOMAIN}
            paths: &paths
              - path: /
                pathType: Prefix
                service:
                  identifier: main
                  port: http
          - host: ha.pub.${CLUSTER_DOMAIN}
            paths: *paths
          - host: ha.home.${CLUSTER_DOMAIN}
            paths: *paths
      editor:
        enabled: false
        hosts:
          - host: ha-editor.pub.${CLUSTER_DOMAIN}
            paths: &paths_editor
              - path: /
                pathType: Prefix
                service:
                  identifier: editor
                  port: http

    route:
      main:
        annotations:
          routeboard.io/group: "automation"
        enabled: true
        hostnames:
          - ha.${CLUSTER_SHORT_DOMAIN}
          - ha.pub.${CLUSTER_DOMAIN}
          - ha.home.${CLUSTER_DOMAIN}
        parentRefs:
          - name: main
            namespace: envoy-gateway
        # explicit rule: 2 services (main + editor) defeat automatic detection
        rules:
          - backendRefs:
              - identifier: main
                port: http
      editor:
        annotations:
          routeboard.io/group: "automation"
        enabled: true
        hostnames:
          - ha-editor.pub.${CLUSTER_DOMAIN}
        parentRefs:
          - name: main
            namespace: envoy-gateway
        # explicit rule: 2 services (main + editor) defeat automatic detection
        rules:
          - backendRefs:
              - identifier: editor
                port: http
