---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: "appdaemon"
spec:
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      interval: 60m
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  interval: 30m
  timeout: 20m
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  # See https://github.com/bjw-s/helm-charts/blob/main/charts/library/common/values.yaml
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: docker.io/acockburn/appdaemon
              tag: 4.5.16 # Adding sha from docker hub breaks (points to invalid arch?)
            env:
              TZ: "Europe/Berlin"
              #LATITUDE: secret
              #LONGITUDE: secret
              #ELEVATION: secret
              HA_URL: "http://home-assistant-main:8123"
              DASH_URL: "http://0.0.0.0:5050"
              # TOKEN: secret
              # 4.5.16 switched to a uv-based entrypoint. Under the restricted-v2
              # SCC the pod runs as a random UID with no HOME, so uv tried to
              # create /.cache/uv and the container died instantly with
              # "Permission denied (os error 13)" -> CrashLoopBackOff. /tmp is
              # writable, so point HOME and the uv cache there.
              HOME: "/tmp"
              UV_CACHE_DIR: "/tmp/uv-cache"
            envFrom:
              - secret: appdaemon-env
            probes:
              liveness:
                enabled: true
                type: TCP
                port: 5050
                spec:
                  initialDelaySeconds: 30
                  periodSeconds: 20
                  timeoutSeconds: 5
                  failureThreshold: 6
              readiness:
                enabled: true
                type: TCP
                port: 5050
                spec:
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 6
            resources:
              requests:
                cpu: 20m
                memory: 192Mi
              limits:
                memory: 512Mi

    persistence:
      config:
        enabled: true
        existingClaim: home-assistant-pvc
        globalMounts:
          - path: /ha-conf
            readOnly: false
          - path: /conf
            readOnly: false
            subPath: appdaemon

    service:
      main:
        controller: main
        ports:
          http:
            port: 5050

    ingress:
      main:
        enabled: false
        hosts:
          - host: ha-app.home.${CLUSTER_DOMAIN}
            paths: &paths
              - path: /
                pathType: Prefix
                service:
                  identifier: main
                  port: http
          - host: ha-app.pub.${CLUSTER_DOMAIN}
            paths: *paths

    route:
      main:
        annotations:
          routeboard.io/group: "automation"
        enabled: true
        hostnames:
          - ha-app.home.${CLUSTER_DOMAIN}
          - ha-app.pub.${CLUSTER_DOMAIN}
        parentRefs:
          - name: main
            namespace: envoy-gateway
