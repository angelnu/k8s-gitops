---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ${MY_NAMESPACE}
spec:
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      interval: 60m
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  interval: 30m
  timeout: 20m
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  # See https://github.com/bjw-s/helm-charts/blob/main/charts/library/common/values.yaml
  values:
    controllers:
      main:
        serviceAccount:
          identifier: default
        pod:
          annotations:
            k8s.v1.cni.cncf.io/networks: |
              [
                {
                  "name": "localnet",
                  "interface": "localnet",
                  "ips": [
                    "${CLUSTER_EXTERNAL_SUBNET_PREFIX}.${CLUSTER_LOCALNET_ESPHOME}/${CLUSTER_LOCALNET_PREFIX_LENGTH}"
                    ]
                }
              ]
        containers:
          main:
            # observed 2026-09-24: p95 220Mi, max 220Mi. Generous limit; review with >=1 week of Prometheus data (idle; compiles need much more)
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 3Gi
            image:
              repository: ghcr.io/esphome/esphome
              tag: 2026.10.0@sha256:1dff19a59070cdb523b76576cdc74d200f862d43c1407809088855920cf57145
            #env:
            #  ESPHOME_DASHBOARD_USE_PING: "true"
          editor:
            image:
              repository: ghcr.io/coder/code-server
              tag: 4.141.1@sha256:bfe06d7f36273d84a61d6bf2f9656b9f612f9c5c6fbb45ba5e19a29b42ded6f4
            args:
              - --auth
              - none
              - --port
              - "12321"
              - /config
            securityContext:
              runAsUser: 0
    serviceAccount:
      default:
        enabled: true
    rbac:
      bindings:
        default:
          type: RoleBinding
          roleRef:
            name: system:openshift:scc:anyuid  # For runAsUser
            kind: ClusterRole
          subjects:
            - identifier: default

    persistence:
      config:
        enabled: true
        existingClaim: esphome-pvc
      build:
        enabled: true
        type: emptyDir
        globalMounts:
          - path: /config/.esphome
            readOnly: false
      cache:
        enabled: true
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 10Gi
        globalMounts:
          - path: /cache
            readOnly: false
      ssh-key:
        enabled: true
        type: secret
        name: git-ssh-keys
        defaultMode: 256
        items:
          - key: id_rsa
            path: id_rsa
        advancedMounts:
          main:
            editor:
              - path: /root/.ssh/id_rsa
                subPath: id_rsa

    service:
      main:
        controller: main
        ports:
          http:
            port: 6052
      editor:
        controller: main
        ports:
          http:
            port: 12321

    ingress:
      main:
        enabled: false
        hosts:
          - host: esphome.pub.${CLUSTER_DOMAIN}
            paths: &paths
              - path: /
                pathType: Prefix
                service:
                  identifier: main
                  port: http
          - host: esphome.home.${CLUSTER_DOMAIN}
            paths: *paths
      editor:
        enabled: false
        hosts:
          - host: esphome-editor.home.${CLUSTER_DOMAIN}
            paths: &paths_editor
              - path: /
                pathType: Prefix
                service:
                  identifier: editor
                  port: http
          - host: esphome-editor.pub.${CLUSTER_DOMAIN}
            paths: *paths_editor

    route:
      main:
        annotations:
          routeboard.io/group: "automation"
        enabled: true
        hostnames:
          - esphome.pub.${CLUSTER_DOMAIN}
          - esphome.home.${CLUSTER_DOMAIN}
        parentRefs:
          - name: main
            namespace: envoy-gateway
        # explicit rule: 2 services (main + editor) defeat automatic detection
        rules:
          - backendRefs:
              - identifier: main
                port: http
      editor:
        annotations:
          routeboard.io/group: "automation"
        enabled: true
        hostnames:
          - esphome-editor.home.${CLUSTER_DOMAIN}
          - esphome-editor.pub.${CLUSTER_DOMAIN}
        parentRefs:
          - name: main
            namespace: envoy-gateway
        # explicit rule: 2 services (main + editor) defeat automatic detection
        rules:
          - backendRefs:
              - identifier: editor
                port: http
