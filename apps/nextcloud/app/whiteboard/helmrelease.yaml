---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nextcloud-whiteboard
spec:
  chart:
    spec:
      chart: app-template
      version: 5.1.0
      interval: 60m
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  dependsOn:
    - name: nextcloud
  interval: 30m
  timeout: 20m
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  # See https://github.com/nextcloud/whiteboard
  values:
    controllers:
      main:
        serviceAccount:
          identifier: default
        containers:
          main:
            image:
              repository: ghcr.io/nextcloud-releases/whiteboard
              tag: v1.5.9@sha256:ba9fb41ab8a79284b4bfab92f6169a376d2c8e1d32f3d4434d14b8f299102a97
            env:
              NEXTCLOUD_URL: http://nextcloud:8080
              STORAGE_STRATEGY: lru
              JWT_SECRET_KEY:
                valueFrom:
                  secretKeyRef:
                    name: nextcloud-whiteboard-secret
                    key: JWT_SECRET_KEY
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 512Mi
    serviceAccount:
      default:
        enabled: true

    service:
      main:
        controller: main
        ports:
          http:
            port: 3002

    ingress:
      main:
        enabled: true
        annotations:
          hajimari.io/enable: "false"
          nginx.ingress.kubernetes.io/enable-global-auth: "false"
          # Keep the persistent websocket connection alive
          nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
          nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
        hosts:
          - host: ${WHITEBOARD_HOST}
            paths:
              - path: /
                pathType: ImplementationSpecific
                service:
                  identifier: main
                  port: http
        tls:
        - hosts:
          - ${WHITEBOARD_HOST}
