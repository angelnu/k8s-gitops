---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app ${MY_APP}
spec:
  chart:
    spec:
      chart: openebs
      version: 4.6.1
      interval: 60m
      sourceRef:
        kind: HelmRepository
        name: openebs
        namespace: openebs
  interval: 30m
  timeout: 20m
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    engines:
      local:
        hostpath:
          enabled: true
        lvm:
          enabled: false
        zfs:
          enabled: false
      replicated:
        mayastor:
          enabled: false
    localpv-provisioner:
      enabled: true
      basepath: "/var/openebs/local" # Use lowercase here
    loki:
      minio:
        # quay.io/minio/* no longer allows anonymous pulls (MinIO stopped
        # publishing community images). Use the copies mirrored to Forgejo.
        image:
          repository: git.angelnu.com/angel/minio
          tag: RELEASE.2024-12-18T13-15-44Z
        # mc is used by the chart post-install/upgrade job (buckets/users).
        # The MinIO server image bundles the mc release the chart expects.
        mcImage:
          repository: git.angelnu.com/angel/minio
          tag: RELEASE.2024-12-18T13-15-44Z
        imagePullSecrets:
          - name: forgejo-registry
