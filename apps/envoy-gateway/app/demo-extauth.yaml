---
# DEMO for step 3.3 (authentik outpost envoy forward-auth): proves the
# SecurityPolicy.extAuth pattern + group authZ end-to-end on the dummy whoami
# route. Delete together with dummy-whoami.yaml once 3.10 validation passes.
# ReferenceGrant in the authentik namespace (real apps will need one per app
# namespace; the `from` list grows as apps migrate in 3.4+).
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: ext-auth-outpost
  namespace: authentik
spec:
  from:
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: envoy-gateway
  to:
    - group: ""
      kind: Service
      name: ak-outpost-ingress
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: whoami-forward-auth
  namespace: envoy-gateway
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: whoami
  extAuth:
    failOpen: false
    recomputeRoute: true
    headersToExtAuth:
      - "X-Forwarded-For"
      - "X-Real-Ip"
      - "accept"
      - "cookie"
      - "authorization"
      - "proxy-authorization"
      - "x-forwarded-proto"
    http:
      backendRefs:
        - kind: Service
          name: ak-outpost-ingress
          namespace: authentik
          port: 9000
      # hardcoded in authentik for envoy ext_authz support
      path: /outpost.goauthentik.io/auth/envoy
      headersToBackend:
        - "Set-Cookie"
        - "X-authentik-uid"
        - "X-authentik-username"
        - "X-authentik-name"
        - "X-authentik-email"
        - "X-authentik-groups"
        - "X-authentik-entitlements"
