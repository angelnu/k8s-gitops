---
# Dummy app to validate the Gateway datapath before migrating real apps (step 3.2).
# Delete this file once the migration validation (3.10) passes.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
spec:
  replicas: 1
  selector:
    matchLabels: {app: whoami}
  template:
    metadata:
      labels: {app: whoami}
    spec:
      containers:
        - name: whoami
          image: docker.io/traefik/whoami:v1.11
          ports: [{containerPort: 80}]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            runAsNonRoot: true
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: whoami
spec:
  selector: {app: whoami}
  ports: [{port: 80, targetPort: 80}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: whoami
spec:
  parentRefs:
    - name: main
      namespace: envoy-gateway
  hostnames:
    - whoami.pub.${CLUSTER_DOMAIN}
  rules:
    - backendRefs:
        - name: whoami
          port: 80
