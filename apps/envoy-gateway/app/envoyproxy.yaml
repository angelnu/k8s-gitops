---
# Shared proxy config for all Gateways: MetalLB IP + source-IP preservation
# (same behaviour as the current ingress-nginx service, see apps/ingress-nginx).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: gateway-config
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        patch:
          type: JSONPatch
          jsonPatch:
            # OKD restricted-v2: drop the hardcoded uid/gid 65532 so the SCC
            # assigns ids from the namespace range (keeps runAsNonRoot etc.)
            - op: remove
              path: /spec/template/spec/containers/0/securityContext/runAsUser
            - op: remove
              path: /spec/template/spec/containers/0/securityContext/runAsGroup
            - op: remove
              path: /spec/template/spec/containers/1/securityContext/runAsUser
            - op: remove
              path: /spec/template/spec/containers/1/securityContext/runAsGroup
      envoyService:
        type: LoadBalancer
        externalTrafficPolicy: Local # keep source IP, same as ingress-nginx today
        annotations:
          metallb.io/loadBalancerIPs: "${CLUSTER_EXTERNAL_SUBNET_PREFIX}.${CLUSTER_LB_GATEWAY}"
