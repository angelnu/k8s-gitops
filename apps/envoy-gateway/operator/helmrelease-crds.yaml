---
# Gateway API CRDs are MANAGED by the OKD Ingress Operator (v1.4.1 standard channel;
# a ValidatingAdmissionPolicy forbids modifying them). We only install the
# Envoy Gateway extension CRDs here (group gateway.envoyproxy.io).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway-crds
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: envoy-gateway-crds-helm
  # version pinned by OCIRepository (semver 1.9.x)
  maxHistory: 3
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    crds:
      gatewayAPI:
        enabled: false # provider-managed (OKD Ingress Operator)
      envoyGateway:
        enabled: true
