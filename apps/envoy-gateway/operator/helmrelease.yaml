---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
# Upstream: https://gateway.envoyproxy.io/latest/install/install-helm/
# The chart's crds/ dir bundles Gateway API CRDs (experimental channel) + EG CRDs.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: envoy-gateway-helm
  # version pinned by the OCIRepository ref (semver 1.9.x; renovate: datasource=docker depName=envoyproxy/gateway-helm)
  maxHistory: 3
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    # OKD manages the Gateway API CRDs (Ingress Operator, v1.4.1 standard) ->
    # the chart must not touch them; EG CRDs come from the envoy-gateway-crds release.
    crds:
      enabled: false
    # OKD restricted-v2: strip the hardcoded uid/gid 65532 so the SCC assigns
    # ids from the namespace range (helm nulls remove the chart defaults).
    topologyInjector:
      enabled: false # optional zone-aware LB helper; not needed in a home cluster
    deployment:
      pod:
        securityContext:
          runAsUser: null
          runAsGroup: null
          fsGroup: null
      envoyGateway:
        securityContext:
          runAsUser: null
          runAsGroup: null
    certgen:
      job:
        securityContext:
          runAsUser: null
          runAsGroup: null
        pod:
          securityContext:
            runAsUser: null
            runAsGroup: null
            fsGroup: null
    config:
      envoyGateway:
        logging:
          level:
            default: info
