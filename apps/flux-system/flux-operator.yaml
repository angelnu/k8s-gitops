apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: flux-operator-charts
  namespace: flux-system
spec:
  interval: 2h
  type: oci
  url: oci://ghcr.io/controlplaneio-fluxcd/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-operator
  namespace: flux-system
spec:
  interval: 10m
  chart:
    spec:
      chart: flux-operator
      version: "0.61.0"
      sourceRef:
        kind: HelmRepository
        name: flux-operator-charts
        namespace: flux-system
  values:
    web:
      config:
        baseURL: https://flux.pub.${CLUSTER_DOMAIN}
        authentication:
          type: OAuth2
          oauth2:
            provider: OIDC
            issuerURL: https://authentik.pub.${CLUSTER_DOMAIN}/application/o/flux-app/
            # clientID: set in secret
            # clientSecret: set in secret
            scopes:
            - openid
            - profile
            - email
            - groups
            - offline_access
      ingress:
        enabled: true
        annotations:
          nginx.ingress.kubernetes.io/enable-global-auth: "false"
        hosts:
          - host: flux.pub.${CLUSTER_DOMAIN}
            paths:
              - path: /
                pathType: Prefix
      httpRoute:
        enabled: true
        hostnames:
          - flux.pub.${CLUSTER_DOMAIN}
        parentRefs:
          - name: main
            namespace: envoy-gateway
  valuesFrom:
  - kind: Secret
    name: flux-operator-values
    valuesKey: values.yaml
    optional: false