---
# Raw HTTPRoute (the openccu chart 3.89.11 has no route support)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: openccu
spec:
  parentRefs:
    - name: main
      namespace: envoy-gateway
  hostnames:
    - homematic.${CLUSTER_SHORT_DOMAIN}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - kind: Service
          name: openccu
          port: 80
