---
# Outpost callback + start endpoints over Gateway API (3.11 fix).
# With ingress-nginx these paths were handled by its global auth config; with
# Envoy Gateway they must be routed explicitly: the outpost
# (ak-outpost-ingress) serves /outpost.goauthentik.io/*, the authentik
# server does NOT (404). Hosts = the external_host of every provider
# (the domain-wide fallback + the per-host providers). The more specific
# path match wins over each app's own route (prefix /).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ak-outpost-callback
  namespace: authentik
  annotations:
    routeboard.io/hidden: "true"
spec:
  parentRefs:
    - name: main
      namespace: envoy-gateway
  hostnames:
    - authentik.pub.${CLUSTER_DOMAIN}
    - esphome.pub.${CLUSTER_DOMAIN}
    - esphome.home.${CLUSTER_DOMAIN}
    - esphome-editor.pub.${CLUSTER_DOMAIN}
    - esphome-editor.home.${CLUSTER_DOMAIN}
    - mealie.pub.${CLUSTER_DOMAIN}
    - mealie.home.${CLUSTER_DOMAIN}
    - ha-editor.pub.${CLUSTER_DOMAIN}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /outpost.goauthentik.io
      backendRefs:
        - kind: Service
          name: ak-outpost-ingress
          port: 9000
          weight: 1
