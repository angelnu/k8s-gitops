apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: "${MY_APP}"
spec:
  chart:
    spec:
      chart: reverse-proxy
      version: 4.0.0
      interval: 60m
      sourceRef:
        kind: HelmRepository
        name: angelnu-helm-charts
        namespace: flux-system
  interval: 30m
  timeout: 20m
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  #See https://github.com/angelnu/helm-charts/blob/main/charts/apps/reverse-proxy/values.yaml
  values:
    instances:
      - name: router
        externalName: casa96.lan
        port: 443
        ingress:
          annotations:
            nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
          hosts:
            - host: router.home.${CLUSTER_DOMAIN}
            - host: router.pub.${CLUSTER_DOMAIN}
      - name: fritz
        # EG (v1.9) does not support ExternalName services as HTTPRoute backends
        # -> pin the device IP (matches the current fritz.box DNS record, static DHCP)
        ip: 192.168.2.182
        port: 80
        ingress:
          hosts:
            - host: fritz.home.${CLUSTER_DOMAIN}
            - host: fritz.pub.${CLUSTER_DOMAIN}
      - name: mobile
        # EG does not support ExternalName backends -> pinned IP (mobile.box)
        ip: 192.168.62.1
        port: 80
        ingress:
          hosts:
            - host: mobile.home.${CLUSTER_DOMAIN}
            - host: mobile.pub.${CLUSTER_DOMAIN}
      - name: pve1
        ip: 192.168.4.11
        port: 8006
        ingress:
          annotations:
            nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
          hosts:
            - host: pve1.home.${CLUSTER_DOMAIN}
            - host: pve1.pub.${CLUSTER_DOMAIN}
      - name: pve2
        ip: 192.168.4.12
        port: 8006
        ingress:
          annotations:
            nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
          hosts:
            - host: pve2.home.${CLUSTER_DOMAIN}
            - host: pve2.pub.${CLUSTER_DOMAIN}
      - name: pve3
        ip: 192.168.4.13
        port: 8006
        ingress:
          annotations:
            nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
          hosts:
            - host: pve3.home.${CLUSTER_DOMAIN}
            - host: pve3.pub.${CLUSTER_DOMAIN}
      - name: pve4
        ip: 192.168.4.14
        port: 8006
        ingress:
          annotations:
            nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
          hosts:
            - host: pve4.home.${CLUSTER_DOMAIN}
            - host: pve4.pub.${CLUSTER_DOMAIN}
      - name: pve5
        ip: 192.168.4.15
        port: 8006
        ingress:
          annotations:
            nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
          hosts:
            - host: pve5.home.${CLUSTER_DOMAIN}
            - host: pve5.pub.${CLUSTER_DOMAIN}
      - name: octoprint
        # EG does not support ExternalName backends -> pinned IP (prusa.lan)
        ip: 192.168.2.171
        port: 80
        ingress:
          hosts:
            - host: prusa.home.${CLUSTER_DOMAIN}
            - host: prusa.pub.${CLUSTER_DOMAIN}
      - name: octoprint-mini
        # EG does not support ExternalName backends -> pinned IP (prusa-mini.lan)
        ip: 192.168.2.47
        port: 80
        test: false
        ingress:
          hosts:
            - host: prusa-mini.home.${CLUSTER_DOMAIN}
            - host: prusa-mini.pub.${CLUSTER_DOMAIN}
      - name: printer
        # EG does not support ExternalName backends -> pinned IP (printer-canon.lan)
        ip: 192.168.2.117
        port: 80
        ingress:
          hosts:
            - host: print.pub.${CLUSTER_DOMAIN}
            - host: print.home.${CLUSTER_DOMAIN}
      - name: prusa-sla
        # EG does not support ExternalName backends -> pinned IP (prusa-sla.lan)
        ip: 192.168.2.98
        port: 80
        test: false
        ingress:
          hosts:
            - host: prusa-sla.pub.${CLUSTER_DOMAIN}
            - host: prusa-sla.home.${CLUSTER_DOMAIN}
      - name: nas
        ip: 192.168.2.10
        port: 5001
        ingress:
          annotations:
            nginx.ingress.kubernetes.io/enable-global-auth: "false"
            nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
          hosts:
            - host: nas.${CLUSTER_SHORT_DOMAIN}
            - host: nas.pub.${CLUSTER_DOMAIN}
      - name: nas-backup
        ip: 192.168.103.24
        port: 5001
        ingress:
          annotations:
            nginx.ingress.kubernetes.io/enable-global-auth: "false"
            nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
          hosts:
            - host: nas-backup.pub.${CLUSTER_DOMAIN}
      - name: pikvm
        ip: 192.168.2.7
        port: 443
        ingress:
          annotations:
            nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
          hosts:
            - host: pikvm.pub.${CLUSTER_DOMAIN}
