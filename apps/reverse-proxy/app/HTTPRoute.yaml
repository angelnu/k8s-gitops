---
# Raw HTTPRoutes for the reverse-proxy chart (angelnu reverse-proxy 4.x): the
# chart has no route.<name> support, so the Gateway API routes live next to
# release.yaml and the chart ingress stays untouched (rule 1 — both models
# coexist until the final cutover).
#
# Envoy Gateway (v1.9) does not support ExternalName services as HTTPRoute
# backends, so the migrated instances in release.yaml were switched from
# externalName to pinned device IPs (chart's native ip/Endpoints mode).
#
# Skipped instances (backend cannot be served through Envoy Gateway yet, they
# keep running via ingress-nginx):
#   - router: backend casa96.lan no longer resolves (503 via ingress-nginx too);
#     needs the router's current address.
#   - nas:    backend cert is self-signed WITHOUT a DNS SAN (email SAN only);
#     EG enforces a DNS SAN match (see envoyproxy/gateway#4595).
#   - nas-backup: backend cert EXPIRED 2020-03-06.
#   - pikvm:  backend cert has no SAN at all (CN=localhost).
# Fix the device certs / address, then add matching routes here.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: reverse-proxy-fritz
  annotations:
    routeboard.io/title: "fritz"
    routeboard.io/group: "network"
spec:
  parentRefs:
    - name: main
      namespace: envoy-gateway
  hostnames:
    - fritz.home.${CLUSTER_DOMAIN}
    - fritz.pub.${CLUSTER_DOMAIN}
  rules:
    - backendRefs:
        - kind: Service
          name: reverse-proxy-fritz
          port: 80
