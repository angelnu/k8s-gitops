# BackendTLSPolicy so Envoy Gateway connects to the unifi controller (port
# 'http' = 8443) over TLS and validates its self-signed cert
apiVersion: gateway.networking.k8s.io/v1alpha3
kind: BackendTLSPolicy
metadata:
  name: unifi-backend-tls
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: unifi
      sectionName: http
  validation:
    hostname: unifi
    caCertificateRefs:
      - group: ""
        kind: ConfigMap
        name: unifi-backend-ca
