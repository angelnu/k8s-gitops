---
# Raw HTTPRoute (the forgejo chart rejects ingress.enabled + httpRoute.enabled
# together, so the chart's own ingress block stays in place per migration rule 1)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: forgejo
  annotations:
    routeboard.io/group: "tools"
spec:
  parentRefs:
    - name: main
      namespace: envoy-gateway
  hostnames:
    - git.${CLUSTER_SHORT_DOMAIN}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - kind: Service
          name: forgejo-http
          port: 3000
