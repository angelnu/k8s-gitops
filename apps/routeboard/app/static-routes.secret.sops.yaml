# Manual catalog ported from hajimari (customApps + globalBookmarks), step 3.9.
# Format: RouteBoard static routes (github.com/dhia-gharsallaoui/routeboard):
# routes[].name (required, unique) / url (required, scheme+host) / title /
# description / group / icon / order / health (default true).
# SOPS-encrypted (credential hints in descriptions); decrypted by the Flux
# Kustomization, then mounted into the pod (ROUTEBOARD_STATIC_ROUTES=/config/routes.yaml).
# Icon notes (step 3.9):
#   - RouteBoard renders card icons from the route NAME via Simple Icons
#     (cdn.simpleicons.org) — the icon field is stored but not yet rendered
#     by the frontend; kept for forward-compat.
#   - hajimari icons were mdi:/logos:/file-icons:/arcticons:/eos-icons: style;
#     mapped to Simple Icons slugs where one exists (proxmox, longhorn,
#     raspberrypi, synology, avm, redhatopenshift — verified 200 on the CDN).
#   - Dropped (no Simple Icons equivalent, route falls back to a globe icon):
#     weather-sunset, file-icons:assembly-intel, mdi:wan, eos-icons:3d-print,
#     bare "printer".
