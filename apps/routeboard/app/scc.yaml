---
# OKD restricted-v2 rejects the chart's podSecurityContext.runAsUser 65534
# (out of the namespace UID range), so grant the chart's service account the
# nonroot SCC — same pattern as apps/forgejo/app/scc.yaml. The SA name must
# match the chart-created SA (routeboard.fullname = "routeboard" = MY_NAMESPACE).
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: app-scc
subjects:
  - kind: ServiceAccount
    name: ${MY_NAMESPACE}
    namespace: ${MY_NAMESPACE}
roleRef:
  kind: ClusterRole
  name: system:openshift:scc:nonroot
  apiGroup: rbac.authorization.k8s.io
