---
# RouteBoard UI on the same hostname hajimari served (home.${CLUSTER_SHORT_DOMAIN}).
# Raw HTTPRoute: the routeboard chart (0.2.0) templates no gatewayAPI/httproute
# support (only a disabled ingress template), so the route lives next to the
# HelmRelease — same pattern hajimari used for its chart (rule 1).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: routeboard
  annotations:
    # RouteBoard's own discovery annotations so the dashboard lists itself in
    # the cluster group (routeboard.io/* replaced hajimari.io/* in step 3.9)
    routeboard.io/title: "RouteBoard"
    routeboard.io/description: "Casa96 home dashboard"
    routeboard.io/group: "cluster"
spec:
  parentRefs:
    - name: main
      namespace: envoy-gateway
  hostnames:
    - home.${CLUSTER_SHORT_DOMAIN}
  rules:
    - backendRefs:
        - kind: Service
          name: routeboard
          port: 80
