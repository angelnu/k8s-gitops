---
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: paperless
  annotations:
    fluxcd.controlplane.io/reconcile: "enabled"
    fluxcd.controlplane.io/reconcileEvery: "30m"
    fluxcd.controlplane.io/reconcileTimeout: "5m"
spec:
  inputs:
    - name: casa
      ignore_dates: 1978-09-19,1979-06-12,2010-2-8,2011-11-15
      ocr_language: deu
      hostname: paperless.pub.${CLUSTER_DOMAIN}
      hajimari_group: documents
      PAPERLESS_INSTANCE_OWNER: angel
    - name: edu
      ignore_dates: 1984-09-09
      ocr_language: spa
      hostname: paperless-edu.pub.${CLUSTER_DOMAIN}
      hajimari_group: spain
      PAPERLESS_EXTRA_SUPERADMIN_USERS: eduardo
      PAPERLESS_INSTANCE_OWNER: eduardo
    - name: javi
      ignore_dates: 1984-09-09
      ocr_language: deu
      hostname: paperless-javi.pub.${CLUSTER_DOMAIN}
      hajimari_group: documents
      PAPERLESS_EXTRA_SUPERADMIN_USERS: javier
      PAPERLESS_INSTANCE_OWNER: javier
    - name: madrid
      ignore_dates: 1984-09-09
      ocr_language: spa
      hostname: paperless-madrid.pub.${CLUSTER_DOMAIN}
      hajimari_group: spain
      SSO_GROUP_READER: madrid
      SSO_GROUP_WRITER: madrid
      PAPERLESS_EXTRA_SUPERADMIN_USERS: eduardo,javier
      PAPERLESS_INSTANCE_OWNER: angelnb
    - name: mireille-work
      ignore_dates: ""
      ocr_language: eng
      hostname: paperless-mireille-work.pub.${CLUSTER_DOMAIN}
      hajimari_group: documents
      PAPERLESS_INSTANCE_OWNER: mireille
    - name: recipes
      ignore_dates: ""
      ocr_language: deu
      hostname: paperless-recipes.pub.${CLUSTER_DOMAIN}
      hajimari_group: documents
      PAPERLESS_INSTANCE_OWNER: mireille
    - name: daniel
      ignore_dates: 2010-2-8
      ocr_language: deu
      hostname: paperless-daniel.pub.${CLUSTER_DOMAIN}
      hajimari_group: documents
      PAPERLESS_INSTANCE_OWNER: daniel
    - name: alicia
      ignore_dates: 2011-11-15
      ocr_language: deu
      hostname: paperless-alicia.pub.${CLUSTER_DOMAIN}
      hajimari_group: documents
      PAPERLESS_INSTANCE_OWNER: alicia
  resources:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: paperless-<< inputs.name >>
        namespace: << inputs.provider.namespace >>
      spec:
        chart:
          spec:
            chart: app-template
            version: 5.0.1
            interval: 60m
            sourceRef:
              kind: HelmRepository
              name: bjw-s
              namespace: flux-system
        interval: 30m
        timeout: 20m
        install:
          remediation:
            retries: -1
        # Add this to force Flux to check the secret's version
        upgrade:
          cleanupOnFail: true
          remediation:
            strategy: rollback
            retries: 3
        # See https://github.com/bjw-s/helm-charts/blob/main/charts/library/common/values.yaml
        values:
          controllers:
            # Configure the main controller
            main:
              annotations:
                reloader.stakater.com/auto: "true"
              containers:
                app:
                  image: &paperless_img
                    repository: ghcr.io/paperless-ngx/paperless-ngx
                    tag: 3.1.1 # renovate: depName=ghcr.io/paperless-ngx/paperless-ngx datasource=docker

                  env: &paperless_env
                    PAPERLESS_OCR_LANGUAGE: << inputs.ocr_language >>
                    PAPERLESS_TIME_ZONE: "Europe/Berlin"
                    PAPERLESS_CONSUMER_POLLING: "60"
                    #PAPERLESS_CONSUMER_RECURSIVE: "true"
                    #PAPERLESS_CONSUMER_SUBDIRS_AS_TAGS: "true"
                    PAPERLESS_REDIS: redis://localhost:6379
                    PAPERLESS_LOGOUT_REDIRECT_URL: https://authentik.pub.${CLUSTER_DOMAIN}/outpost.goauthentik.io/sign_out
                    PAPERLESS_IGNORE_DATES: "<< inputs.ignore_dates >>"
                    PAPERLESS_URL: https://<< inputs.hostname >>
                    
                    # Cache .pyc in the container layer: compiled once per pod
                    # instead of once per manage.py invocation (~15s -> ~8s each).
                    # Costs ephemeral storage.
                    PYTHONDONTWRITEBYTECODE: ""                    
                    
                    # Remote proxy user
                    # PAPERLESS_ENABLE_HTTP_REMOTE_USER: "true"
                    # PAPERLESS_HTTP_REMOTE_USER_HEADER_NAME: HTTP_X_AUTHENTIK_USERNAME

                    # OIDC
                    PAPERLESS_SOCIAL_AUTO_SIGNUP: "true"
                    PAPERLESS_DISABLE_REGULAR_LOGIN: "true"
                    PAPERLESS_REDIRECT_LOGIN_TO_SSO: "true"
                    PAPERLESS_APPS: "allauth.socialaccount.providers.openid_connect,casa"
                    PAPERLESS_SOCIAL_ACCOUNT_SYNC_GROUPS: "true"

                    # Casa app
                    SSO_GROUP_READER: '<< dig "SSO_GROUP_READER" "casa96" inputs >>'
                    SSO_GROUP_WRITER: '<< dig "SSO_GROUP_WRITER" "casa_editors" inputs >>'
                    SSO_GROUP_ADMIN: '<< dig "SSO_GROUP_ADMIN" "admin" inputs >>'
                    PAPERLESS_EXTRA_SUPERADMIN_USERS: '<< dig "PAPERLESS_EXTRA_SUPERADMIN_USERS" "" inputs >>'
                    PAPERLESS_PROTECTED_USERS: '<< dig "PAPERLESS_PROTECTED_USERS" "admin" inputs >>'
                    # Empty default on purpose: the casa app then falls back to
                    # the lowest-pk superuser, and defers to first login if none
                    # exists. Defaulting to "admin" would hand documents to the
                    # local break-glass account, which has no SSO login.
                    PAPERLESS_INSTANCE_OWNER: '<< dig "PAPERLESS_INSTANCE_OWNER" "" inputs >>'

                    # Hardening
                    PAPERLESS_ACCOUNT_SESSION_REMEMBER: "false"
                    PAPERLESS_SESSION_COOKIE_AGE: "43200"
                    PAPERLESS_ACCOUNT_DEFAULT_HTTP_PROTOCOL: "https"
                    PAPERLESS_CSRF_TRUSTED_ORIGINS: https://<< inputs.hostname >>
                    PAPERLESS_ALLOWED_HOSTS: << inputs.hostname >>
                  envFrom: &paperless_envfrom
                    - secret: paperless-env-values
                broker:
                  image:
                    repository: docker.io/library/redis
                    tag: 8.10@sha256:691577adaf11927f4bb8871d40a5dd69a5c300d4453b742e8f6383c3e6e8d2e1 # renovate: depName=docker.io/library/redis datasource=docker

          persistence:
            data:
              enabled: true
              type: persistentVolumeClaim
              existingClaim: paperless-pvc
              globalMounts:
              - path: /usr/src/paperless/data
                subPath: << inputs.name >>
            media:
              enabled: true
              type: custom
              globalMounts:
              - path: /usr/src/paperless/media
                readOnly: false
              volumeSpec:
                nfs:
                  server: "${NFS_SERVER}"
                  path: "${NFS_KUBERNETES}/paperless/<< inputs.name >>/media"
            consume:
              enabled: true
              type: custom
              globalMounts:
              - path: /usr/src/paperless/consume
                readOnly: false
              volumeSpec:
                nfs:
                  server: "${NFS_SERVER}"
                  path: "${NFS_DOWNLOADS}/scanner/<< inputs.name >>"
            export:
              enabled: true
              type: custom
              globalMounts:
              - path: /usr/src/paperless/export
                readOnly: false
              volumeSpec:
                nfs:
                  server: "${NFS_SERVER}"
                  path: "${NFS_KUBERNETES}/paperless/<< inputs.name >>/export"
            casa-app:
              type: configMap
              name: paperless-casa-app
              globalMounts:
              - path: /usr/src/paperless/src/casa
                readOnly: true

          serviceAccount:
            default:
              enabled: true
          rbac:
            bindings:
              default:
                type: RoleBinding
                roleRef:
                  name: system:openshift:scc:hostmount-anyuid-v2
                  kind: ClusterRole
                subjects:
                  - identifier: default

          service:
            main:
              controller: main
              ports:
                http:
                  port: 8000

          ingress:
            main:
              enabled: true
              annotations:
                hajimari.io/enable: "true"
                hajimari.io/icon: arcticons:paperless
                hajimari.io/info: Store PDFs
                hajimari.io/group: << inputs.hajimari_group >>
                nginx.ingress.kubernetes.io/proxy-body-size: 4G
                nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
                nginx.ingress.kubernetes.io/enable-global-auth: "false"
              hosts:
                - host: << inputs.hostname >>
                  paths:
                    - path: /
                      pathType: Prefix
                      service:
                        identifier: main
                        port: http