---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: "${MY_APP}"
spec:
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      interval: 60m
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  interval: 30m
  timeout: 20m
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  # See https://github.com/bjw-s/helm-charts/blob/main/charts/library/common/values.yaml
  values:
    controllers:
      main:
        serviceAccount:
          identifier: default
        containers:
          main:
            # 2026-10-07: 1536Mi limit caused SIGBUS (exit 135) at MA 2.10.5 startup (providers+ffmpeg spike);
            # crashloop corrupted library.db (issue #6435). MA docs recommend >=4Gi for full features (Smart Fades).
            # steady-state p95 is ~560Mi, so requests stay modest; limits give startup headroom.
            resources:
              requests:
                cpu: 20m
                memory: 1Gi
              limits:
                memory: 4Gi
            image:
              repository: ghcr.io/music-assistant/server
              tag: 2.10.6
            env:
              TZ: "Europe/Berlin"
        pod:
        #   hostAliases:
        #     # We cannot access the ingress LB address directly - go through external IP
        #     - ip: "${FIX_EXTERNAL_IP}"
        #       hostnames:
        #         - "nextcloud.${CLUSTER_DOMAIN}"
        #         - "jellyfin.pub.${CLUSTER_DOMAIN}"

          annotations:
            k8s.v1.cni.cncf.io/networks: |
              [
                {
                  "name": "localnet",
                  "interface": "localnet",
                  "ips": [
                    "${CLUSTER_EXTERNAL_SUBNET_PREFIX}.${CLUSTER_LOCALNET_MA}/${CLUSTER_LOCALNET_PREFIX_LENGTH}"
                    ]
                }
              ]
    serviceAccount:
      default:
        enabled: true
    rbac:
      bindings:
        default:
          type: RoleBinding
          roleRef:
            name: system:openshift:scc:hostmount-anyuid-v2  # For runAsUser and NFS mount
            kind: ClusterRole
          subjects:
            - identifier: default

    persistence:
      data:
        # Music Assistant only supports sqlite (aiosqlite/sqlite3 hardcoded) and
        # sqlite memory-maps its DB (~2GiB mmap_size on this host) -> SIGBUS on the
        # NFS-backed /data. Move ONLY the sqlite data to a Longhorn PVC (fast, non-NFS)
        # so MA is stable. The music/downloads content stays on NFS.
        enabled: true
        type: persistentVolumeClaim
        existingClaim: music-assistant-data
      music:
        enabled: true
        type: custom
        volumeSpec:
          nfs:
            server: "${NFS_SERVER}"
            path: "${NFS_MUSIC}"
      downloads:
        enabled: true
        type: custom
        volumeSpec:
          nfs:
            server: "${NFS_SERVER}"
            path: "${NFS_DOWNLOADS}"

    service:
      main:
        controller: main
        ports:
          http:
            port: 8095

    ingress:
      main:
        enabled: false
        hosts:
          - host: ma.pub.${CLUSTER_DOMAIN}
            paths: &paths
              - path: /
                pathType: Prefix
                service:
                  identifier: main
                  port: http
      home:
        enabled: false
        annotations:
          nginx.ingress.kubernetes.io/enable-global-auth: "false"
          nginx.ingress.kubernetes.io/whitelist-source-range: "${INGRESS_WHITELIST_SOURCE_RANGE}"
        hosts:
          - host: ma.home.${CLUSTER_DOMAIN}
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: main
                  port: http

    route:
      main:
        annotations:
          routeboard.io/group: "media"
        enabled: true
        hostnames:
          - ma.pub.${CLUSTER_DOMAIN}
        parentRefs:
          - name: main
            namespace: envoy-gateway
      home:
        annotations:
          routeboard.io/hidden: "true"
        enabled: true
        hostnames:
          - ma.home.${CLUSTER_DOMAIN}
        parentRefs:
          - name: main
            namespace: envoy-gateway
